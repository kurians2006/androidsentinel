name: 'AndroidSentinel PR Reviewer'
description: 'Autonomous AI Code Reviewer and Security Auditor for Android, Kotlin & Java pull requests'
author: 'AndroidSentinel Contributors'
inputs:
  github-token:
    description: 'GitHub token with PR comment and review permissions'
    required: true
    default: ${{ github.token }}
  api-key:
    description: 'LLM API Key (Gemini, Claude, or OpenAI)'
    required: true
  model:
    description: 'Model to use for review'
    required: false
    default: 'gemini-2.5-pro'
runs:
  using: 'node20'
  main: 'src/review.js'
branding:
  icon: 'shield'
  color: 'green'
